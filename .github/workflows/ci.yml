name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        # windows-latest cannot be added: the runner derives its workspace directory from the
        # repository name, so checkout looks for D:\a\V.A.L.I.D.\V.A.L.I.D.\ and Windows strips
        # the trailing dot from a directory name. actions/checkout fails with "Directory ... does
        # not exist" before any step runs. A Windows build is therefore only provable locally —
        # done for this change, see the PR verification notes.
        os: [ubuntu-latest, macos-latest]
    
    runs-on: ${{ matrix.os }}
    
    steps:
    - uses: actions/checkout@v4
      with:
        path: valid

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          8.0.x
          10.0.x

    - name: Restore dependencies
      working-directory: valid
      run: dotnet restore VALID.slnx

    - name: Build solution
      working-directory: valid
      run: dotnet build VALID.slnx --no-restore --configuration Release

    - name: Run tests
      working-directory: valid
      run: dotnet test VALID.slnx --no-build --configuration Release --verbosity normal

  security-scan:
    runs-on: ubuntu-latest
    needs: build-and-test
    
    steps:
    - uses: actions/checkout@v4
      with:
        path: valid

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          8.0.x
          10.0.x

    - name: Install dotnet-security-scan
      run: dotnet tool install --global dotnet-security-scan || true

    - name: Security scan
      working-directory: valid
      run: dotnet-security-scan src/Valid/Valid.csproj || echo "Security scan completed with findings"

  pack:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main'
    
    steps:
    - uses: actions/checkout@v4
      with:
        path: valid

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          8.0.x
          10.0.x

    - name: Build for packing
      working-directory: valid
      run: dotnet build src/Valid/Valid.csproj --configuration Release

    - name: Pack NuGet packages
      working-directory: valid
      run: dotnet pack src/Valid/Valid.csproj --configuration Release --output ./dist --no-build

    - name: Upload package artifact
      uses: actions/upload-artifact@v4
      with:
        name: valid-nupkg
        path: valid/dist/*.nupkg
